# =============================================================================
# mise — ポリグロットバージョン・ツール管理
# https://mise.jdx.dev/
#
# 初回セットアップ:
#   mise trust && mise install
#   mise run setup
# =============================================================================

[tools]
# ── ランタイム ──────────────────────────────────────────────
go     = "1.26"       # go.mod / Dockerfile と一致
node   = "24"         # Dockerfile node:24-trixie-slim と一致 (Active LTS)
python = "3.14"       # スクリプト・ツール用

# ── パッケージマネージャ ───────────────────────────────────
uv   = "0.11.3"       # Python 高速パッケージマネージャ
pnpm = "10.33.0"      # Node.js 高速パッケージマネージャ（frontend/package.json packageManager と一致）

# ── クラウド・ホスティング CLI ──────────────────────────────
gh     = "2.89.0"     # GitHub CLI（aqua:cli/cli）
gcloud = "564.0.0"    # Google Cloud SDK（vfox:mise-plugins/vfox-gcloud）

# ── Go 開発ツール ──────────────────────────────────────────
golangci-lint                 = "2.11.4"
"go:github.com/air-verse/air" = "v1.65.0"
# goose は不要（マイグレーションはサーバー起動時に自動適用）

# ── Markdown（.markdownlint-cli2.jsonc）──────────────────
"npm:markdownlint-cli2" = "0.17.2"

[settings]
auto_install = true

# ── 環境変数（ローカル開発用） ─────────────────────────────
[env]
_.file = [".env", ".env.local"]

# ── タスク ──────────────────────────────────────────────────

[tasks.setup]
description = "プロジェクト初期セットアップ（Go モジュール取得 + pnpm install）"
depends = ["setup:backend", "setup:cli", "setup:frontend"]

[tasks."setup:backend"]
description = "バックエンドの Go モジュールを取得"
dir = "backend"
run = "go mod download"

[tasks."setup:cli"]
description = "CLI の Go モジュールを取得"
dir = "cli"
run = "go mod download"

[tasks."setup:frontend"]
description = "フロントエンドの依存パッケージをインストール"
dir = "frontend"
run = "pnpm install"

[tasks.dev]
description = "Docker Compose で開発環境を起動"
run = "docker compose up --build --watch"

[tasks."dev:backend"]
description = "バックエンドのみ起動（air ホットリロード）"
dir = "backend"
run = "air"

[tasks."dev:frontend"]
description = "フロントエンドのみ起動"
dir = "frontend"
run = "pnpm dev"

[tasks."dev:down"]
description = "開発環境を停止"
run = "docker compose down"

[tasks.test]
description = "全テスト実行"
depends = ["test:backend", "test:cli", "test:frontend"]

[tasks."test:backend"]
description = "バックエンドテストのみ"
dir = "backend"
run = "go test -v -race -cover ./..."

[tasks."test:frontend"]
description = "フロントエンドテストのみ"
dir = "frontend"
run = "pnpm test"

[tasks."test:cli"]
description = "CLI のテストのみ"
dir = "cli"
run = "go test -v -race -cover ./..."

[tasks."test:coverage"]
description = "カバレッジレポート生成"
depends = ["test:coverage:backend", "test:coverage:cli", "test:coverage:frontend"]

[tasks."test:coverage:backend"]
description = "バックエンドのカバレッジレポート生成"
dir = "backend"
run = [
  "go test -race -coverprofile=coverage.out ./...",
  "go tool cover -html=coverage.out -o coverage.html",
]

[tasks."test:coverage:cli"]
description = "CLI のカバレッジレポート生成"
dir = "cli"
run = [
  "go test -race -coverprofile=coverage.out ./...",
  "go tool cover -html=coverage.out -o coverage.html",
]

[tasks."test:coverage:frontend"]
description = "フロントエンドのカバレッジレポート生成"
dir = "frontend"
run = "pnpm test:coverage"

[tasks.lint]
description = "静的解析（全体）"
depends = ["lint:backend", "lint:cli", "lint:frontend", "lint:markdown"]

[tasks."lint:backend"]
description = "バックエンド Lint のみ"
dir = "backend"
run = "golangci-lint run ./..."

[tasks."lint:frontend"]
description = "フロントエンド Lint のみ"
dir = "frontend"
run = ["pnpm lint", "pnpm type-check"]

[tasks."lint:cli"]
description = "CLI Lint のみ"
dir = "cli"
run = "golangci-lint run ./..."

[tasks."lint:markdown"]
description = "Markdown（markdownlint-cli2）のみ"
run = "markdownlint-cli2"

[tasks.fmt]
description = "コードフォーマット（Go + Prettier + Markdown）"
depends = ["fmt:backend", "fmt:cli", "fmt:frontend", "fmt:markdown"]

[tasks."fmt:backend"]
description = "バックエンドを gofmt で整形"
dir = "backend"
run = "gofmt -w ."

[tasks."fmt:cli"]
description = "CLI を gofmt で整形"
dir = "cli"
run = "gofmt -w ."

[tasks."fmt:frontend"]
description = "フロントエンドを Prettier で整形"
dir = "frontend"
run = "pnpm format"

[tasks."fmt:markdown"]
description = "Markdown を markdownlint-cli2 --fix で自動修正"
run = "markdownlint-cli2 --fix"

[tasks.build]
description = "本番用 Docker イメージビルド"
depends = ["build:backend", "build:frontend"]

[tasks."build:backend"]
description = "バックエンドの Docker イメージビルド"
dir = "backend"
run = "docker build -t webapp-backend ."

[tasks."build:frontend"]
description = "フロントエンドの Docker イメージビルド"
dir = "frontend"
run = "docker build -t webapp-frontend ."

[tasks."db:up"]
description = "DB コンテナのみ起動"
run = "docker compose up -d db"

# 接続先は DATABASE_URL（.env またはシェルの環境変数）で変更できる。未設定なら compose の DB を使う
[tasks."db:migrate"]
description = "DB マイグレーション実行（golang-migrate）"
depends = ["db:up"]
dir = "backend"
env = { DATABASE_URL = "{{ env.DATABASE_URL | default(value='postgres://postgres:password@localhost:5432/webapp?sslmode=disable') }}" }
run = "go run ./cmd/migrate up"

[tasks."db:migrate:down"]
description = "DB マイグレーションを 1 つ戻す（golang-migrate）"
depends = ["db:up"]
dir = "backend"
env = { DATABASE_URL = "{{ env.DATABASE_URL | default(value='postgres://postgres:password@localhost:5432/webapp?sslmode=disable') }}" }
run = "go run ./cmd/migrate down"

[tasks."db:migrate:version"]
description = "DB マイグレーションの現在バージョンと dirty フラグを表示"
depends = ["db:up"]
dir = "backend"
env = { DATABASE_URL = "{{ env.DATABASE_URL | default(value='postgres://postgres:password@localhost:5432/webapp?sslmode=disable') }}" }
run = "go run ./cmd/migrate version"

[tasks.clean]
description = "ビルド成果物をクリーンアップ"
depends = ["clean:backend", "clean:cli", "clean:frontend"]
run = "docker compose down -v"

# rm は Windows の既定シェルにないため、mise が管理する node で削除する
[tasks."clean:backend"]
description = "バックエンドのビルド成果物を削除"
dir = "backend"
run = "node -e \"for (const f of ['coverage.out', 'coverage.html', 'server', 'server.exe']) fs.rmSync(f, { force: true })\""

[tasks."clean:cli"]
description = "CLI のビルド成果物を削除"
dir = "cli"
run = "node -e \"for (const f of ['coverage.out', 'coverage.html', 'webapp-cli', 'webapp-cli.exe']) fs.rmSync(f, { force: true })\""

[tasks."clean:frontend"]
description = "フロントエンドのビルド成果物を削除"
dir = "frontend"
run = "node -e \"for (const f of ['dist', 'coverage']) fs.rmSync(f, { recursive: true, force: true })\""

[tasks.check]
description = "CI 相当のチェック（lint + test）"
depends = ["lint", "test"]

[tasks.info]
description = "現在の開発環境情報を表示"
run = [
  "mise current",
  "go version",
  "node --version",
  "python --version",
  "pnpm --version",
  "uv --version",
  "gh --version",
  "gcloud --version",
]
