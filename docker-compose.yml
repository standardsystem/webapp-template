services:
  # 起動時に DB マイグレーションを 1 度だけ実行する short-lived service。
  # 本番では Cloud Run Job としてデプロイされ、deploy パイプラインの一部として実行される。
  migrate:
    build:
      context: ./backend
      target: builder
    command: go run ./cmd/migrate up
    environment:
      DATABASE_URL: "postgres://postgres:password@db:5432/webapp?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: builder   # 開発時はビルドステージを使用
    command: go run ./cmd/server
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      FRONTEND_ORIGIN: "http://localhost:5173"
      DATABASE_URL: "postgres://postgres:password@db:5432/webapp?sslmode=disable"
      JWT_SECRET: "dev-secret-change-in-production-at-least-32-chars"
      COOKIE_SECURE: "false"
      # OAuth のコールバックは、ブラウザが開いているフロントのオリジン（/api は backend へ転送される）で受ける
      INITIAL_ADMIN_EMAILS: "${INITIAL_ADMIN_EMAILS:-}"
      ALLOWED_EMAIL_DOMAINS: "${ALLOWED_EMAIL_DOMAINS:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URL: "http://localhost:5173/api/v1/auth/google/callback"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      GITHUB_REDIRECT_URL: "http://localhost:5173/api/v1/auth/github/callback"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET}"
      MICROSOFT_REDIRECT_URL: "http://localhost:5173/api/v1/auth/microsoft/callback"
      MICROSOFT_TENANT_ID: "${MICROSOFT_TENANT_ID}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app

  frontend:
    build:
      context: ./frontend
      target: builder
    command: pnpm dev --host
    ports:
      - "5173:5173"
    environment:
      # Vite の開発サーバーが /api を転送する先。コンテナ内の localhost は frontend 自身を指すため、
      # compose のサービス名で backend を指定する。
      API_PROXY_TARGET: "http://backend:8080"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 統合テスト（mise run test:integration）専用の DB。
  # テストがテーブルを空にするため、開発用の db とは別のコンテナにしている。
  # profile を付けているので、mise run dev（docker compose up）では起動しない。
  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webapp_test
    # データは残さない（コンテナを作り直すたびに空になる）
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webapp_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
