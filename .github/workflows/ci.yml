name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 検査の中身は .mise.toml のタスクに定義し、CI はそれを呼び出すだけにする。
# ローカルの `mise run check` と同じコマンド・同じバージョンのツールで検査するため。
env:
  # 各ジョブは install_args で指定したツールだけを使う（gcloud などを毎回入れない）
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  # ---- Markdown / GitHub Actions ワークフロー ----
  docs:
    name: Markdown & Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5
        with:
          install_args: node npm:markdownlint-cli2 actionlint

      - name: Lint Markdown
        run: mise run lint:markdown

      - name: Lint workflows
        run: mise run lint:actions

      - name: Test scripts
        run: mise run test:scripts

  # ---- Go バックエンド ----
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5
        with:
          install_args: go node golangci-lint go:golang.org/x/vuln/cmd/govulncheck

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-backend-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: go-backend-${{ runner.os }}-

      - name: Lint
        run: mise run lint:backend

      - name: Vulnerability check
        run: mise run vuln:backend

      # ユニットテストと DB を使う統合テストをまとめて実行し、カバレッジのしきい値を検査する。
      # テスト用の PostgreSQL は、ローカルと同じく docker compose の db-test を使う。
      - name: Test (unit + integration)
        run: mise run test:integration

  # ---- Go CLI ----
  cli-test:
    name: CLI Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5
        with:
          install_args: go golangci-lint go:golang.org/x/vuln/cmd/govulncheck

      - name: Lint
        run: mise run lint:cli

      - name: Vulnerability check
        run: mise run vuln:cli

      - name: Test
        run: mise run test:cli

  # ---- フロントから API への経路 ----
  routing-smoke:
    name: Routing Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5
        with:
          install_args: node

      # Vite の開発サーバー経由と、本番イメージの nginx 経由の両方で /api が backend に届くことを確認する
      - name: Smoke test /api routing (Vite proxy and nginx)
        run: mise run test:routing

  # ---- React フロントエンド ----
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm

      # CI では pnpm install が --frozen-lockfile で動く
      - name: Install dependencies
        run: mise run setup:frontend

      # 監査 API の障害でも CI を止めないよう、警告にとどめる
      - name: Audit dependencies
        run: mise run audit:frontend || echo "::warning::pnpm audit failed (vulnerabilities found or endpoint unavailable)"

      - name: Lint
        run: mise run lint:frontend

      - name: Test with coverage
        run: mise run test:frontend

      - name: Build
        run: mise run build:frontend:dist

      # 本番イメージをビルドし、/api のリバースプロキシを含む nginx の設定を検査する
      - name: Check nginx config in the production image
        run: mise run test:frontend:image
